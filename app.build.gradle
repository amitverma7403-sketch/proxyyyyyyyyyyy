// The workflow moves this file to app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nodeconsole.node'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nodeconsole.node'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // frpc is shipped as libfrpc.so and must be extracted to disk so it can be executed
            useLegacyPackaging = true
            keepDebugSymbols.add('**/libfrpc.so')
        }
    }
}
