// The workflow moves this file to app/build.gradle
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nodemax.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nodemax.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            // one fixed signing key: phones and Play Protect trust an app that is always signed the same way
            storeFile file(System.getenv('KS_FILE') ?: 'nodemax.jks')
            storePassword System.getenv('KS_PASS') ?: ''
            keyAlias 'nodemax'
            keyPassword System.getenv('KS_PASS') ?: ''
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        debug {
            debuggable = false
        }
        release {
            // not debuggable: nobody can read the pairing token out of the app with adb
            debuggable = false
            minifyEnabled false  // obfuscated code is a common reason for scanners to flag an app
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // frpc is shipped as libfrpc.so and must be extracted to disk so it can be executed
            useLegacyPackaging = true
            keepDebugSymbols.add('**/libfrpc.so')
        }
    }
}

dependencies {
    // QR scanner that runs inside Google Play Services
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
